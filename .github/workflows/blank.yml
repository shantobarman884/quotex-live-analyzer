
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source archive
        run: |
          mkdir project
          unzip source.zip -d project
          find project -maxdepth 4 -type f | head -80

      - name: Build debug APK
        run: |
          cd project
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle assembleDebug
          else
            echo "Android Gradle project not found at archive root"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quotex-live-analyzer-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: platforms tools 
          retention-days: 7
compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}
